services:
  transcritor:
    build: .
    ports:
      - "8082:8082"
    environment:
      # Defina a MESMA chave que você colocar na Vercel (TRANSCRITOR_APIKEY).
      - TRANSCRITOR_APIKEY=${TRANSCRITOR_APIKEY:-troque-esta-chave}
      - WHISPER_MODEL=${WHISPER_MODEL:-small}
      - WHISPER_COMPUTE=int8
      # Proxy residencial (opcional): defina PROXY_URL no arquivo .env desta pasta
      # (http://user:pass@host:port). Sem ele, funciona direto.
      - PROXY_URL=${PROXY_URL:-}
      # Supabase Storage — usado pela camuflagem de áudio (baixa o MP4 enviado,
      # sobe o resultado). Mesma service key do The Track. Defina no .env.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      # Cache do modelo baixado (não re-baixa a cada restart).
      - whisper-cache:/root/.cache/huggingface
    # Teto de memória e de CPU. Sem isto, um ffmpeg decodificando um 4K HEVC
    # cresce até comer os ~3,8 GB da VPS e derruba TODOS os containers junto
    # (Whisper, scraper, Evolution, Postgres) — a máquina trava e só volta com
    # reboot. Com o teto, o pior caso é o job falhar; o resto continua de pé.
    mem_limit: 2500m
    memswap_limit: 2500m
    cpus: 3.0
    restart: unless-stopped

volumes:
  whisper-cache:
